name: Sync inventory from Google Sheet

on:
  schedule:
    - cron: "0 */1 * * *"   # every 1 hours
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run inventory sync
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
        run: node inventory-scanner/sync-inventory.js

      - name: Commit and push if products.js changed
        run: |
          git config user.name "Inventory Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.js
          git diff --cached --quiet || git commit -m "Auto-sync inventory from Google Sheet"
          git push
